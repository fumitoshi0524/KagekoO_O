[project]
name = "KagekoO_O"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch",
    "torchvision",
    "markupsafe>=2.0",
    "transformers>=5.3.0",
    "openai>=2.29.0",
    "python-dotenv>=1.2.2",
    "duckduckgo-search>=8.1.1",
    "google>=3.0.0",
    "google-generativeai>=0.8.6",
    "anthropic>=0.86.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "tiktoken>=0.12.0",
    "chromadb>=0.6.0",
    "mcp>=1.2.0",
    "numpy>=2.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
markupsafe = { index = "pypi" }
