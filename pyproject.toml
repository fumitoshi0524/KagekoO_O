[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KagekoO_O"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.57.1",
    "chromadb>=1.5.7",
    "dotenv>=0.9.9",
    "google-genai>=1.13.0",
    "openai>=2.30.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
kageko-qaoa = "cli_qaoa:main"
kageko = "qaoa.cli:_entrypoint"

[tool.setuptools]
packages = ["qaoa", "qaoa.adapters", "qaoa.daemon", "qaoa.pipeline", "qaoa.tools"]
py-modules = ["KagekoO_O", "cli_qaoa", "qaoa.cli"]

[tool.uv]
package = true

[dependency-groups]
dev = ["deptry>=0.25.1"]
