[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "kageko"
version = "0.1.0"
description = "Three-in-one AI agent: coding, general-purpose, research"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "openai>=1.60.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.11.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "textual>=0.89.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "pydantic>=2.10.0",
    "tomli>=2.2.0",
    "python-dotenv>=1.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
kageko = "kageko.cli:app"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "src/kageko_native/Cargo.toml"
python-source = "src"
module-name = "kageko._native"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
